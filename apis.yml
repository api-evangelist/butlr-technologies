name: Butlr Technologies
description: >-
  Butlr Technologies is a privacy-first people-sensing platform that uses
  anonymous, heat-based (thermal) occupancy sensors to deliver real-time
  activity insights for healthier, more efficient physical spaces across
  workplaces, senior living, retail, and education. Butlr exposes a developer
  platform behind api.butlr.io consisting of a GraphQL API for asset management
  (organizations, sites, buildings, floors, rooms, zones, hives, sensors, and
  tags), a RESTful Reporting API v3 for historical time-series occupancy and
  traffic, and event-driven webhooks for real-time occupancy, traffic, and PIR
  motion. Access is authenticated with OAuth 2.0 (Auth0) via password and
  client-credentials grants, and an official read-only Model Context Protocol
  (MCP) server connects AI assistants to the platform. Surfaced as a 500 Global
  portfolio company and enriched into the API Evangelist network.
